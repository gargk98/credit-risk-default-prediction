name: credit-risk

# Minimal environment for reproducing the analysis. Versions are lower-bounded
# rather than pinned to exact builds, so the environment solves on macOS, Linux,
# and Windows. The versions noted are those used to produce the published results.
#
#   conda env create -f environment.yml
#   conda activate credit-risk

channels:
  - conda-forge

dependencies:
  - python=3.10
  - numpy>=2.2          # 2.2.6
  - pandas>=2.3         # 2.3.3
  - scipy>=1.15         # 1.15.3
  - matplotlib>=3.10    # 3.10.9
  - statsmodels>=0.14   # 0.14.6
  - scikit-learn>=1.6   # 1.7.2 -- 1.6 is the minimum for sklearn.frozen.FrozenEstimator
  - py-xgboost>=3.0     # 3.2.0
  - jupyterlab>=4.5
